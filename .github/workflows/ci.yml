name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    container: python:3.12-bookworm

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          apt-get update && apt-get install -y --no-install-recommends libsndfile1 libportaudio2

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Lint
        continue-on-error: true
        run: |
          pip install ruff
          ruff check earworm/ tests/

      - name: Test
        run: pytest tests/ -v

      - name: Notify Discord
        if: always()
        continue-on-error: true
        shell: bash
        env:
          WEBHOOK_ID: ${{ secrets.DISCORD_CI_WEBHOOK_ID }}
          WEBHOOK_TOKEN: ${{ secrets.DISCORD_CI_WEBHOOK_TOKEN }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then
            ICON="✅"; WORD="succeeded"
          else
            ICON="❌"; WORD="failed"
          fi
          SHORT_SHA="${GITHUB_SHA:0:7}"
          curl -s -X POST \
            "https://discord.com/api/webhooks/${WEBHOOK_ID}/${WEBHOOK_TOKEN}" \
            -H "Content-Type: application/json" \
            --data-raw "{\"content\":\"**${ICON} Build ${WORD}** — ${{ github.repository }} #${{ github.run_number }}\nBranch: \`${{ github.ref_name }}\` | Commit: \`${SHORT_SHA}\`\n${RUN_URL}\"}"
