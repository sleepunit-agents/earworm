when:
  - event: push
    branch: main
  - event: pull_request

steps:
  - name: install
    image: python:3.12-bookworm
    commands:
      - apt-get update && apt-get install -y --no-install-recommends libsndfile1
      - pip install -e ".[dev]"

  - name: lint
    image: python:3.12-bookworm
    commands:
      - pip install ruff
      - ruff check earworm/ tests/
    depends_on: [install]
    failure: ignore

  - name: test
    image: python:3.12-bookworm
    commands:
      - apt-get update && apt-get install -y --no-install-recommends libsndfile1
      - pip install -e ".[dev]"
      - pytest tests/ -v
    depends_on: [install]

  - name: discord-notify
    image: appleboy/drone-discord
    when:
      status: [success, failure]
    settings:
      webhook_id:
        from_secret: discord_webhook_id
      webhook_token:
        from_secret: discord_webhook_token
      message: "{{#success build.status}}**✅ Build succeeded** — {{repo.name}} #{{build.number}}{{else}}**❌ Build failed** — {{repo.name}} #{{build.number}}{{/success}}\nBranch: `{{build.branch}}` | Commit: `{{truncate build.commit 7}}`\n{{build.link}}"
    depends_on: [lint, test]
